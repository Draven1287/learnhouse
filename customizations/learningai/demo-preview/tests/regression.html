<meta charset="utf-8"><h1>Design regression checks</h1><pre id="result">Running…</pre><iframe id="frame" width="390" height="820"></iframe>
<script>
(async()=>{const results=[], f=document.querySelector('iframe'),wait=ms=>new Promise(r=>setTimeout(r,ms));const check=(name,ok)=>{results.push({name,passed:!!ok});if(!ok)throw Error(name)};const open=async path=>{await new Promise(r=>{f.onload=r;f.src='about:blank'});await new Promise(r=>{f.onload=r;f.src=path});await wait(1100)};const route=async hash=>{f.contentWindow.location.hash=hash;await wait(700)};const el=s=>f.contentDocument.querySelector(s);const click=async s=>{el(s).click();await wait(700)};const fill=(s,v)=>{el(s).value=v;el(s).dispatchEvent(new f.contentWindow.Event('input',{bubbles:true}))};try{
 await open('../demo.html');f.contentWindow.localStorage.clear();await open('../demo.html#lesson-1');check('normal storage warning visually hidden',f.contentWindow.getComputedStyle(el('#save-warn')).display==='none');check('mobile save status readable',parseFloat(f.contentWindow.getComputedStyle(el('#save-state')).fontSize)>0);check('three core steps',el('.lstep').textContent.includes('/03'));await click('.answer');check('neutral selected mark',f.contentWindow.getComputedStyle(el('.answer[aria-pressed=true] .k'),'::before').content.includes('●'));check('selection keeps stable core total',el('.lstep').textContent.includes('/03'));check('wrong answer explained',el('#o').textContent.includes('Not quite'));await click('#next');check('remediation does not inflate core total',el('.lstep').textContent.includes('/03'));
 await route('join');fill('#nm','Local One');fill('#em','one@example.test');fill('#pw','fictionaltest123');el('#ok13').checked=true;await click('#f button[type=submit]');fill('#code','123456');await click('#f button[type=submit]');const id1=f.contentWindow.localStorage.getItem('learningai-demo-session');check('unique profile id',id1.startsWith('local-'));await open('../demo.html#account');check('local profile reload survives',el('#nm').value==='Local One');await click('#so');await route('join');fill('#nm','Local Two');fill('#em','two@example.test');fill('#pw','fictionaltest123');el('#ok13').checked=true;await click('#f button[type=submit]');fill('#code','123456');await click('#f button[type=submit]');const id2=f.contentWindow.localStorage.getItem('learningai-demo-session');check('profiles isolated',id1!==id2);await open('../demo.html#signin');check('local profiles rediscoverable',f.contentDocument.body.textContent.includes('Local One'));
 await open('../dist/index.html#join');check('production mode',f.contentWindow.LAI_MODE==='production');check('production collects no credentials',!el('input[type=password]')&&!el('input[type=email]'));check('production honest unavailable state',f.contentDocument.body.textContent.includes('Account services are not connected'));check('no seeded demo loaded',!f.contentWindow.LAI_DEMO);await route('lesson-1');const original=f.contentWindow.Storage.prototype.setItem;f.contentWindow.Storage.prototype.setItem=function(){throw Error('simulated blocked storage')};await click('.answer');check('failed write visibly warned',f.contentWindow.getComputedStyle(el('#save-warn')).display!=='none');check('failed write status truthful',el('#save-state').textContent.includes('Not saved'));f.contentWindow.Storage.prototype.setItem=original;
}catch(e){results.push({error:e.message})}document.querySelector('#result').textContent=JSON.stringify(results,null,2);window.REGRESSION_RESULTS=results})();
</script>
