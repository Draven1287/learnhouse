<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearningAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..700;1,62..125,300&display=swap">
<style>
/* LearningAI. A hypercar maker's restraint, applied to learning: pure black and white, no accent colour.
   One family (Archivo): extended light capitals for display and labels, normal width for reading.
   One idea per screen; motion is a staged reveal with a single easing curve. */
:root{
  --bg:#000; --raise:#0B0B0B; --surface:#0A0A0A; --surface-2:#0F0F0F; --well:#050505;
  --text:#F4F4F2; --text-2:#D9D9D6; --muted:#8E8E8B; --dim:#777774; --deco:#4A4A48; --track:#2A2A29;
  --err:#E59A8D; --err-line:#B85C4F;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.45);
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --gutter:max(32px,calc((100vw - 1200px)/2 + 32px));
  --cap-fs:11px; --cap-ls:.22em;
  color-scheme:dark;
}
@media (max-width:640px){:root{--gutter:20px}}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-padding-top:100px;scrollbar-color:#333 transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16.5px;line-height:1.65;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
/* No highlighting: no selection colour, no tap flash, no hover or pressed fills (exceptions: menu words, footer links and your initials brighten when pointed at).
   A chosen option shows a check mark instead. Keyboard focus keeps a thin outline for accessibility. */
::selection{background:transparent;color:inherit}
*{-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-stretch:125%;font-weight:300;text-transform:uppercase;letter-spacing:.02em;line-height:1.08;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--text);outline-offset:4px}
main:focus,h1:focus{outline:none}
input,textarea{caret-color:var(--text)}
.wrap{padding-inline:var(--gutter)} /* --gutter already centres content in a 1200px column */
.cap{font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums lining-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:20px;top:16px;z-index:99;background:var(--text);color:#000;padding:8px 14px}

/* ---------- one arrow, one button system, one link style ---------- */
.ar{display:inline-block;flex:none;width:var(--ar-w,24px);height:1px;background:currentColor;position:relative;transition:width .35s var(--ease)}
.ar::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.rev .ar{transform:scaleX(-1)}
a:hover > .ar,button:hover > .ar{width:calc(var(--ar-w,24px) + 10px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:50px;padding:0 24px;border-radius:2px;border:1px solid var(--line-2);background:transparent;color:var(--text);font:500 11.5px var(--font);font-stretch:125%;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.white{background:var(--text);color:#000;border-color:var(--text)}
.btn.white:focus-visible{outline:0;box-shadow:0 0 0 2px #000,0 0 0 3px var(--text)}
.btn.sm{height:44px;padding:0 18px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:default}
.btn .chev{font-size:15px;letter-spacing:0;line-height:1;margin-top:-2px;transition:transform .3s var(--ease)}
.btn:hover .chev{transform:translateX(3px)}
.btn.danger{color:var(--err);border-color:rgba(229,154,141,.4)}
.ulink{display:inline-flex;align-items:center;gap:12px;font-stretch:125%;font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding:0 0 4px;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;transition:background-size .4s var(--ease);border:0;color:inherit;cursor:pointer}
.ulink:hover{background-size:0 1px;background-position:100% 100%}
.ulink.plain{background:none;padding:12px 0}
.ulink:disabled{opacity:.3;cursor:default}
.ulink.inline{font-stretch:100%;font-size:inherit;letter-spacing:0;text-transform:none;font-weight:inherit;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:8px 18px;border:1px solid var(--line-2);border-radius:2px;background:transparent;color:var(--muted);font:500 11.5px var(--font);font-stretch:125%;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.opt[aria-pressed="true"]::before{content:"✓";margin-right:10px}

/* ---------- header ---------- */
.nav{position:fixed;top:0;padding-top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
.nav.solid{background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom-color:var(--line)}
.nav-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.mark{justify-self:center;font-stretch:125%;font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.menu-trigger,.mx-close{justify-self:start;display:inline-flex;align-items:center;gap:14px;background:none;border:0;color:var(--text);cursor:pointer;padding:12px 0;font:500 11.5px var(--font);font-stretch:125%;letter-spacing:var(--cap-ls);text-transform:uppercase}
.menu-trigger i{display:grid;gap:6px;width:26px}
.menu-trigger i::before,.menu-trigger i::after{content:"";height:1px;background:currentColor;display:block;transition:transform .4s var(--ease)}
.menu-trigger:hover i::after{transform:scaleX(.6);transform-origin:left}
.mx-close i{position:relative;width:20px;height:20px}
.mx-close i::before,.mx-close i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:currentColor;transform:rotate(45deg)}
.mx-close i::after{transform:rotate(-45deg)}
.nav-ctx{justify-self:end;display:inline-flex;align-items:center;gap:10px;font-stretch:125%;font-size:11.5px;font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;padding:12px 0;--ar-w:18px}
.avatar{width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--line-2);justify-content:center;letter-spacing:.06em;font-size:13px;color:var(--text);transition:border-color .2s,background .2s,color .2s}
.avatar:hover,.avatar:focus-visible{background:var(--text);color:#000;border-color:var(--text)}
@media (max-width:640px){.mark{font-size:12px;letter-spacing:.3em}.menu-trigger span,.nav-ctx .t,.mx-close span{display:none}}

/* ---------- motion ---------- */
.rv{opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:var(--d,0ms)}
.in .rv{opacity:1;transform:none}
.lesson[data-dir="next"] .rv{transform:translateX(44px)}
.lesson[data-dir="back"] .rv{transform:translateX(-44px)}
.lesson.in .rv{transform:none}
.mask{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.mask > span{display:block;transform:translateY(108%);transition:transform .9s var(--ease)}
.in .mask > span{transform:none}
.out{opacity:0;transition:opacity .18s var(--ease-in)}

/* ---------- menu: curtain wipe, words and cards travel rightward into place ---------- */
/* Menu: a solid black screen (nothing shows through). Each word slides out from the left on its own, one after another,
   all the same size and aligned; on close each continues to the right, last word first, then the page returns. */
.mx{position:fixed;inset:0;z-index:90;color:var(--text)}
.mx-curtain{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .4s ease}
.mx.open .mx-curtain{opacity:1}
.mx-in{position:relative;height:100%;padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-rows:76px 1fr auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
.mx-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.mx-grid{display:grid;align-items:center;min-height:0}
.mx-words{display:grid;gap:6px;justify-items:start}
.mx-words a{display:block;color:#6E6E6B;font-stretch:125%;font-weight:300;font-size:clamp(34px,5vw,68px);line-height:1.12;text-transform:uppercase;letter-spacing:.01em;opacity:0;transform:translateX(-120px);transition:opacity .5s var(--ease),transform .8s var(--ease),color .25s ease;transition-delay:var(--d),var(--d),0s}
.mx-words a:hover,.mx-words a:focus,.mx-words a:active{color:var(--text)}
.mx-foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;opacity:0;transition:opacity .5s ease .62s}
.mx-foot a{color:var(--text-2)}
.mx.open .mx-words a{opacity:1;transform:none}
.mx.open .mx-foot{opacity:1}
.mx.closing .mx-words a{opacity:0;transform:translateX(80px);transition:opacity .28s ease,transform .38s var(--ease-in);transition-delay:var(--dc,0ms)}
.mx.closing .mx-foot{opacity:0;transition:opacity .2s ease;transition-delay:0s}
.mx.closing .mx-curtain{opacity:0;transition:opacity .4s ease .3s}
@media (max-width:900px){.mx-words a{font-size:clamp(30px,9vw,46px)}}

/* ---------- home: a personal briefing. A big greeting, then lines that arrive one after another
   (fading in from a soft blur), then a question with one clear answer. ---------- */
.hi-when{margin-bottom:22px}
.hi-quote{margin-top:26px;font-style:italic;font-weight:300;font-size:clamp(18px,1.6vw,22px);color:var(--text-2)}
.why-p{margin-top:30px;max-width:30em;font-size:clamp(19px,1.7vw,24px);line-height:1.55;color:var(--text-2)}
.why-try{margin-top:22px;color:var(--muted)}
.in .hi-go{opacity:1;transform:none}
.hi-go{display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-top:24px;opacity:0;transform:translateY(8px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
.hi-go .ulink{color:var(--muted)}
/* statement: lights up word by word while you scroll through it */
.hs{padding:clamp(150px,22vh,240px) var(--gutter) 40px}
.hin{padding:40px var(--gutter) 120px}
.hin h2{font-size:clamp(28px,3.4vw,48px)}
.hin .why-p{margin-top:18px}
.hin .hi-go{margin-top:34px;opacity:1;transform:none}
.cwork{margin-top:48px}
.sso{display:grid;gap:22px;max-width:460px;margin-bottom:30px}
.sso-g{width:100%}
.or{display:flex;align-items:center;gap:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.input.code{font-size:28px;letter-spacing:.5em;font-variant-numeric:tabular-nums;max-width:260px}
.hs-t{font-size:clamp(30px,4.4vw,64px);font-weight:300;line-height:1.18;letter-spacing:-.01em;max-width:18em}
.hs-t span{color:#2E2E2D;transition:color .6s ease;transition-delay:calc(250ms + var(--i) * 55ms)}
.in .hs-t span{color:var(--text)}
/* one screen per part: its object, its lessons, your progress */
/* progress you can always see: one segment per lesson, filled as far as you've got */
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:30px;max-width:520px}
.segs i{height:4px;background:#262625;border-radius:2px;overflow:hidden}
.segs b{display:block;height:100%;background:var(--text)}
/* closing */
/* arrive on scroll */
html.calm .hi-go{opacity:1!important;filter:none!important;transform:none!important}
@media (prefers-reduced-motion:reduce){.hi-go{opacity:1;transform:none}.hs-t span{color:var(--text)}}

/* ---------- home, signed in: one screen, progress first ---------- */
.hy{min-height:calc(100svh - 96px);display:flex;flex-direction:column;justify-content:center;padding:96px var(--gutter) 32px}
.hy h1{font-size:clamp(40px,min(6vw,8.5vh),104px);font-weight:200;line-height:.95;letter-spacing:0;overflow-wrap:anywhere}
.prog{margin-top:clamp(32px,6vh,72px);max-width:1100px}
.prog-top{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
.prog-pct{color:var(--text);font-stretch:125%;font-weight:200;font-size:clamp(72px,min(11vw,15vh),176px);line-height:.85;letter-spacing:-.03em}
.prog-pct small{font-size:.4em;letter-spacing:0;margin-left:4px}
.prog-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.prog-part{display:grid;gap:12px}
.prog-segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.prog-segs i{position:relative;height:10px;border-radius:2px;box-shadow:inset 0 0 0 1px #5A5A58}
.prog-segs i.full{box-shadow:none}
.prog-segs b{display:block;height:100%;max-width:100%;border-radius:2px;background:var(--text);transition:width 1.1s var(--ease)}
/* "you are here": a thin mark at the edge of your progress; it breathes slowly (off with Calm or reduced motion) */
.here{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--text);border-radius:1px;animation:here 2.6s ease-in-out infinite}
@keyframes here{50%{opacity:.35}}
.prog-start{color:var(--text-2)}
.state-zero .prog-top{min-height:1px}
/* complete: one slow sweep of light, once */
.prog-bar{position:relative;overflow:hidden;padding-block:6px;margin:22px 0 -6px} /* the 6px padding leaves room for the marker; the top margin keeps the number clear of the bar */
.prog.sweep .prog-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-100%);animation:sweep 1.6s var(--ease) .2s 1 forwards;pointer-events:none}
@keyframes sweep{to{transform:translateX(100%)}}
html.calm .here,html.calm .prog.sweep .prog-bar::after{animation:none}
html.calm .prog-segs b{transition:none}
.hy .hi-go{margin-top:32px}
.hy .hi-quote{margin-top:24px}
/* footer: the course facts sit right above the links; links brighten when you point at them */
.foot{display:grid;justify-items:center;gap:12px;padding:20px var(--gutter) 28px;border-top:1px solid var(--line);text-align:center}
.foot nav{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.foot nav a{font-stretch:125%;font-size:11px;font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;color:var(--dim);transition:color .2s}
.foot nav a:hover,.foot nav a:focus-visible{color:var(--text)}
/* ---------- projects and the empty toolkit ---------- */
.empty{color:var(--muted);font-size:18px;margin:-24px 0 48px}
.projs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);max-width:860px}
.projs li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:28px;align-items:start;padding:36px 0;border-bottom:1px solid var(--line)}
.projs .no{font-stretch:125%;font-weight:100;font-size:76px;line-height:.85;letter-spacing:-.03em}
.projs h2{font-size:clamp(22px,2.4vw,32px)}
.projs p{color:var(--muted);font-size:17px;margin-top:10px;max-width:34em}
@media (max-width:640px){.projs li{grid-template-columns:1fr;gap:10px}.projs .no{font-size:56px}}
/* ---------- finished: what you wrote, signed ---------- */
.fin{min-height:100svh;display:grid;align-content:center;gap:28px;padding-block:140px 96px;max-width:calc(860px + 2 * var(--gutter))}
.fin h1{font-size:clamp(40px,6vw,96px);font-weight:200;overflow-wrap:anywhere}
.sheet{border:1px solid var(--line-2);padding:40px 44px;display:grid;gap:14px}
.sheet-q{color:var(--muted);font-size:15px;margin-top:10px}
.sheet-a{font-size:clamp(19px,1.8vw,24px);line-height:1.5;color:var(--text);font-weight:300}
.sheet-sig{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-stretch:125%;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.fin-go{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){.sheet{padding:28px 22px}}
/* ---------- the course dial, silver numerals, curriculum rows, lesson cover ---------- */
.silver{display:inline-block;width:max-content;background:linear-gradient(180deg,#F4F4F2 0%,#B8B8B5 55%,#5C5C5A 100%);padding:.08em .06em .08em 0;margin-block:-.08em;-webkit-background-clip:text;background-clip:text;color:transparent} /* sized to its glyphs so the gradient never clips them */
.cpart{margin-bottom:28px}
.prow .no.silver{font-stretch:125%;font-weight:100;font-size:72px;line-height:.85;letter-spacing:-.03em}
.crows{list-style:none;margin:0 0 0 144px;padding:0}
.crow{display:grid;grid-template-columns:56px minmax(0,1fr) 80px 130px;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.crow .no{color:var(--dim);font-size:13px;letter-spacing:.1em}
.crow .lt{font-size:17px}
span.crow .lt{color:var(--muted)}
@media (max-width:760px){.crows{margin-left:0}.crow{grid-template-columns:40px minmax(0,1fr) auto}.crow > .cap:not(.state){display:none}}
.lc{min-height:100svh;display:grid;grid-template-columns:auto minmax(0,1fr);gap:64px;align-items:center;padding-block:140px 96px}
.lc-num{font-stretch:125%;font-weight:100;font-size:clamp(150px,20vw,320px);line-height:.8;letter-spacing:-.04em}
.lc-body{max-width:640px}
.lc h1{font-size:clamp(32px,4.2vw,60px);margin-top:18px}
.lc-steps{list-style:none;margin:36px 0 0;padding:0;border-top:1px solid var(--line)}
.lc-steps li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.lc-steps li.done,.lc-steps li.now{color:var(--text)}
.lc-steps .no{font-size:13px;letter-spacing:.1em}
.lc-meta{margin-top:18px}
.lc-go{margin-top:32px}
.ask{margin-top:36px;font-size:20px;line-height:1.5;color:var(--text)}
@media (max-width:900px){.lc{grid-template-columns:1fr;gap:12px;padding-block:120px 72px}.lc-num{font-size:120px}}
.lead-line{margin-top:26px;color:var(--muted);font-size:clamp(17px,1.4vw,20px);line-height:1.55;max-width:30em}
.lead-line em{font-style:normal;color:var(--text)}

/* ---------- inner pages ---------- */
.page{padding-top:180px;padding-bottom:120px}
/* instrument parts every page shares: header with readouts, mini dial, step strip */
.ihead{display:block;margin-bottom:64px}
.ihead .kick{display:block;margin-bottom:22px}
.ihead h1{font-size:clamp(36px,4.6vw,68px);overflow-wrap:break-word}
.ihead p{color:var(--muted);font-size:18px;max-width:34em;margin-top:22px}
.subtabs{display:flex;gap:34px;padding:6px 6px 0;margin:0 -6px 64px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs a{flex:none;padding:0 0 18px;color:var(--dim);font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .2s}
.subtabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--text)}
@media (max-width:480px){.subtabs{gap:22px}}

/* course parts and lesson rows */
.rows{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:120px minmax(0,1fr) 140px 40px;gap:24px;align-items:center;padding:32px 0;border-bottom:1px solid var(--line)}
.prow > *{transition:transform .4s var(--ease)}
.prow:hover > *{transform:translateX(6px)}
.prow h2{font-size:clamp(22px,2.6vw,34px)}
.prow p{color:var(--muted);margin-top:8px;max-width:34em}
.prow .cap{text-align:right}
@media (max-width:760px){.prow{grid-template-columns:72px minmax(0,1fr)}.prow .cap{grid-column:2;text-align:left}.prow .ar{display:none}}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) 80px 130px;gap:20px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.lrow .no{font-size:13px;letter-spacing:.1em;color:var(--dim)}
.lt{font-size:17px}
.state{text-align:right;white-space:nowrap}
.state.done,.state.now{color:var(--text)}
@media (max-width:760px){.lrow{grid-template-columns:50px minmax(0,1fr) auto;row-gap:12px;padding:24px 0}.lrow .no{font-size:22px}.lrow > .cap:not(.state){display:none}}

/* toolkit */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);max-width:860px}
.slot{aspect-ratio:1;background:var(--bg);border:0;color:var(--dim);font:200 clamp(22px,3vw,34px) var(--font);font-stretch:125%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;position:relative;cursor:default}
.slot small{font-stretch:100%;font-size:11px;font-weight:400;letter-spacing:.02em;line-height:1.3;color:var(--deco);padding:0 10px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.got{color:var(--text);cursor:pointer}
.slot.got small{color:var(--muted)}
.slot.got::after{content:"";position:absolute;top:12px;right:12px;width:3px;height:14px;background:var(--text)}
.slot:focus-visible{outline:2px solid var(--text);outline-offset:-4px;z-index:1}
@media (max-width:640px){.slot small{display:none}}
.slot-detail{max-width:760px;margin-top:48px}
.slot-detail h2{font-size:clamp(22px,2.6vw,32px);margin:14px 0 28px}
.slot-detail dl{margin:0;border-top:1px solid var(--line)}
.slot-detail dl div{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.slot-detail dd{margin:0;color:var(--text-2)}
@media (max-width:600px){.slot-detail dl div{grid-template-columns:1fr;gap:6px}}

/* projects */
.footnote{margin-top:72px;color:var(--muted)}

/* about: one page, four sections */
.about-sec{margin-top:96px;scroll-margin-top:110px}
.about-sec > h2{font-size:clamp(22px,2.4vw,30px);margin-bottom:28px}
.short{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);max-width:860px}
.short li{display:grid;grid-template-columns:80px 1fr;gap:20px;padding:26px 0;border-bottom:1px solid var(--line);font-size:18px}
.short li .cap{padding-top:5px}
.faq{border-top:1px solid var(--line);max-width:860px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 0;cursor:pointer;font-size:19px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:11px;height:11px;flex:none;background:linear-gradient(var(--text),var(--text)) center/11px 1px no-repeat,linear-gradient(var(--text),var(--text)) center/1px 11px no-repeat;transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding-bottom:28px;max-width:40em}

/* ---------- lesson view ---------- */
.lbar{position:fixed;top:0;padding-top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.lbar-in{display:grid;grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr);gap:16px;align-items:center;height:76px}
.lbar-in > .ulink{justify-self:start}
.lbar .t{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.lbar .r{justify-self:end;display:flex;align-items:center;gap:10px}
.lbar .r i{width:6px;height:6px;border-radius:50%;background:var(--text)}
.lbar .ulink{color:var(--muted)}
@media (max-width:480px){.lbar .r{font-size:0;gap:0}}
.lstrip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding-bottom:1px}
.lstrip i{height:2px;background:var(--track)}
.lstrip i.on{background:var(--text-2)}
.lstrip i.now{background:var(--text)}
.lstep{display:flex;align-items:baseline;gap:16px}
.lstep .v{font-stretch:125%;font-weight:200;font-size:44px;line-height:1;letter-spacing:-.01em}
.lstep .v small{font-size:13px;font-weight:500;letter-spacing:.16em;color:var(--muted);margin-left:6px}
.lesson{max-width:700px;margin:0 auto;padding:180px 24px 160px}
@media (max-width:640px){.lesson{padding:140px 20px}}
.lesson h1{font-size:clamp(28px,4vw,46px);margin-top:20px}
.body p{color:var(--text-2);font-size:18px;line-height:1.75;margin-top:22px}
.body p:first-child{margin-top:36px}
.body p.muted{color:var(--muted)}
.field-lbl{display:block;margin-top:40px;font-size:clamp(18px,1.6vw,20px);line-height:1.5;color:var(--text)}
::placeholder{color:var(--dim);opacity:1}
textarea{width:100%;margin-top:24px;min-height:120px;background:#0B0B0B;border:1px solid var(--line-2);border-radius:6px;color:var(--text);font:inherit;font-size:17px;line-height:1.55;padding:14px 16px;resize:vertical}
.field-lbl + textarea{margin-top:10px;min-height:140px}
textarea:focus{outline:2px solid var(--text);outline-offset:2px;border-color:var(--text)}
.answers{display:grid;gap:10px;margin-top:40px}
.answer{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;text-align:left;width:100%;padding:22px 24px;border:1px solid var(--line-2);background:transparent;color:var(--text);font:inherit;font-size:16.5px;cursor:pointer;transition:border-color .2s}
.answer .k{font-stretch:125%;font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--muted);padding-top:3px}
.answer[aria-pressed="true"] .k{font-size:0}
.answer[aria-pressed="true"] .k::before{content:"✓";font-size:15px;color:var(--text)}
.obj{margin-top:28px;font-size:20px;font-weight:300;line-height:1.5;color:var(--text)}
.case{margin-top:36px;padding:22px 24px;border:1px solid var(--line);border-left:1px solid var(--text)}
.case .cap{display:block;margin-bottom:10px}
.case p{color:var(--text-2);font-size:17px;line-height:1.65}
.why{display:block;margin-top:10px;color:var(--muted)}
.count{display:block;margin-top:8px;color:var(--dim)}
.rubric{margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
.rubric ul{margin:12px 0 0;padding-left:18px;color:var(--text-2);display:grid;gap:8px}
.rubric p{margin-top:16px;color:var(--muted);font-size:15px}
.need{margin-top:14px;text-align:right;color:var(--muted);min-height:1.4em}
.outcome{margin-top:28px;padding:24px 0;border-top:1px solid var(--text);color:var(--text-2)}
.outcome:focus{outline:none}
.outcome .cap{display:block;margin-bottom:10px;color:var(--text)}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:80px;padding-top:28px;border-top:1px solid var(--line)}
.lfoot .ulink{color:var(--muted)}

/* ---------- forms: sign in, join, reset ---------- */
.auth{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-top:76px}
.auth-l{padding:120px 64px 64px var(--gutter);display:flex;flex-direction:column;justify-content:space-between;gap:32px;border-right:1px solid var(--line)}
.auth-l h1{font-size:clamp(40px,4.4vw,72px);overflow-wrap:anywhere}
.auth-l p{color:var(--muted);font-size:18px;margin-top:22px;max-width:22em;overflow-wrap:anywhere}
.auth-l p b{font-weight:500;color:var(--text)}
.auth-r{padding:120px var(--gutter) 64px 64px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-l{border-right:0;padding:56px 20px 0}.auth-r{padding:40px 20px 64px}}
.form{display:grid;gap:30px;max-width:460px;width:100%}
.fld{display:grid;gap:10px}
.fld label,.fld .lbl{font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;color:var(--muted)}
.input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);color:var(--text);font:400 19px var(--font);padding:10px 0 12px;border-radius:0;transition:border-color .25s}
.input:focus{outline:none;border-bottom-color:var(--text)}
.input[aria-invalid="true"]{border-bottom-color:var(--err-line)}
.fld .row{display:flex;align-items:center;gap:12px}
.fld .row .input{flex:1}
.hint{font-size:14px;color:var(--muted)}
.err{font-size:14px;color:var(--err)}
.chk{display:flex;gap:14px;align-items:flex-start;cursor:pointer;color:var(--text-2);font-size:15.5px}
.chk input{appearance:none;width:20px;height:20px;border:1px solid var(--line-2);border-radius:2px;flex:none;margin-top:1px;display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--text);border-color:var(--text)}
.chk input:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid #000;border-bottom:1.5px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.notice{border-left:1px solid var(--text);padding:6px 0 6px 18px;color:var(--text-2);font-size:15px}
.notice:focus{outline:none}
.pwmeter{display:flex;gap:6px}.pwmeter i{flex:1;height:2px;background:var(--track);transition:background .3s}.pwmeter i.on{background:var(--text)}

.auth-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;height:76px}
.auth-top .ulink{color:var(--muted)}
.demo{margin-top:56px;max-width:460px;border-top:1px solid var(--line);padding-top:18px}
.demo summary{cursor:pointer;list-style:none}.demo summary::-webkit-details-marker{display:none}
.demo summary::after{content:" +";color:var(--dim)}.demo[open] summary::after{content:" –"}
.demo ul{list-style:none;padding:0;margin:16px 0 0}
.demo li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.demo li b{display:block;font-weight:400}
.demo .hint{display:block}
.demo > .hint{margin-top:14px}

/* ---------- settings ---------- */
.set-row{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:28px;align-items:center;padding:30px 0;border-bottom:1px solid var(--line)}
.set-row:first-child{border-top:1px solid var(--line)}
.set-row .k{font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase}
.set-row .v{color:var(--muted);font-size:16px}
.set-row .v b{color:var(--text);font-weight:400}
.set-row .input{width:min(320px,100%);padding-block:6px}
@media (max-width:760px){.set-row{grid-template-columns:1fr;gap:12px}}
#out{margin-top:28px}
#out:empty{display:none}
.form #out{margin-top:0}

/* ---------- learner preferences ---------- */
html.text-lg body{font-size:18.5px}
html.text-lg .lead-line,html.text-lg .set-row .v,html.text-lg .body p{font-size:20px}
html.calm *,html.calm *::before,html.calm *::after{transition:none!important;animation:none!important}
html.calm .rv,html.calm .mask > span,html.calm .mx-words a,html.calm .mx-foot{opacity:1!important;transform:none!important}
html.calm .mx-curtain{opacity:1!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv,.mask > span{opacity:1!important;transform:none!important}
  .mx-curtain,.mx-words a,.mx-foot{opacity:1;transform:none}
}
/* 44px touch targets */
.menu-trigger,.mx-close{min-height:44px;min-width:44px}
.avatar{width:44px;height:44px}
.ulink.plain{min-height:44px}
.foot nav a,.mx-foot a{display:inline-flex;align-items:center;min-height:44px}
/* Calm: the menu can still close */
html.calm .mx.closing .mx-curtain,html.calm .mx.closing .mx-words a,html.calm .mx.closing .mx-foot{opacity:0!important}
/* lesson 01: short intro first, the longer explanation is optional */
.lesson .case{margin-top:24px}
.lesson .ask{margin-top:28px}
.more.idea{margin-top:18px;border-top:0;padding-top:0}
.more{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}
.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase}
.more p{margin-top:8px;font-size:17px;line-height:1.65}
/* honest saving */
#save-state.bad{color:var(--err)}
.save-line{color:var(--muted);font-size:15px;max-width:40em}
.save-warn{margin-top:22px;padding:18px 20px;border:1px solid var(--err-line);border-radius:6px;color:var(--text-2);display:grid;gap:12px;justify-items:start}
.save-warn b{color:var(--err);font-weight:500}
/* marketing (signed out): no menu, and a few sections about the course */
.nav.no-menu .menu-trigger{display:none}
.nav.no-menu .mark{grid-column:1;justify-self:start;padding-left:0} /* no menu: the logo leads on the left, Sign in on the right */
.nav.no-menu .nav-ctx{grid-column:3}
.mk{padding:96px var(--gutter);border-top:1px solid var(--line)}
.mk > .cap{display:block;margin-bottom:18px}
.mk h2{font-size:clamp(28px,3.4vw,48px);max-width:18em}
.mk h3{font-stretch:125%;font-weight:400;font-size:clamp(18px,1.6vw,22px);letter-spacing:.04em;text-transform:uppercase;margin:0}
.mk-parts{list-style:none;margin:40px 0 0;padding:0;border-top:1px solid var(--line);max-width:960px}
.mk-parts li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
.mk-parts .no{font-stretch:125%;font-weight:100;font-size:64px;line-height:.85;letter-spacing:-.03em}
.mk-parts p,.mk-steps p{color:var(--muted);margin-top:8px;font-size:17px}
.mk-steps{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;max-width:1100px}
.mk-steps li{border-top:1px solid var(--line-2);padding-top:22px;display:grid;gap:12px}
.mk-peek{max-width:760px;margin-top:32px}
.mk-answers{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.mk-answers a{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:18px 22px;border:1px solid var(--line-2);border-radius:2px;font-size:17px;transition:border-color .2s}
.mk-answers .k{font-stretch:125%;font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--muted);padding-top:3px}
.mk .short{margin-top:32px}
.mk-links{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.mk-end{text-align:left;padding-bottom:120px}
@media (max-width:760px){.mk{padding:72px var(--gutter)}.mk-parts li{grid-template-columns:64px minmax(0,1fr)}.mk-parts li > .cap{grid-column:2}.mk-parts .no{font-size:44px}.mk-steps{grid-template-columns:1fr;gap:28px}}
