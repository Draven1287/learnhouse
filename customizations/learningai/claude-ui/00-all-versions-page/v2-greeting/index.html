<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{background:#000}</style>
<title>LearningAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..700;1,62..125,300&display=swap">
<style>
/* LearningAI. A hypercar maker's restraint, applied to learning: pure black and white, no accent colour.
   One family (Archivo): extended light capitals for display and labels, normal width for reading.
   One idea per screen; motion is a staged reveal with a single easing curve. */
:root{
  --bg:#000; --raise:#0B0B0B; --surface:#0A0A0A; --surface-2:#0F0F0F; --well:#050505;
  --text:#F4F4F2; --text-2:#D9D9D6; --muted:#8E8E8B; --dim:#777774; --deco:#4A4A48; --track:#2A2A29;
  --err:#E59A8D; --err-line:#B85C4F;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0);
  --gutter:max(32px,calc((100vw - 1200px)/2 + 32px));
  --cap-fs:11px; --cap-ls:.22em;
  color-scheme:dark;
}
@media (max-width:640px){:root{--gutter:20px}}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-padding-top:100px;scrollbar-color:#333 transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16.5px;line-height:1.65;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
::selection{background:var(--text);color:#000}
h1,h2,h3{margin:0;font-stretch:125%;font-weight:300;text-transform:uppercase;letter-spacing:.02em;line-height:1.08;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--text);outline-offset:4px}
main:focus,h1:focus{outline:none}
input,textarea{caret-color:var(--text)}
.wrap{padding-inline:var(--gutter)} /* --gutter already centres content in a 1200px column */
.cap{font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums lining-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:20px;top:16px;z-index:99;background:var(--text);color:#000;padding:8px 14px}

/* ---------- one arrow, one button system, one link style ---------- */
.ar{display:inline-block;flex:none;width:var(--ar-w,24px);height:1px;background:currentColor;position:relative;transition:width .35s var(--ease)}
.ar::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.rev .ar{transform:scaleX(-1)}
a:hover > .ar,button:hover > .ar{width:calc(var(--ar-w,24px) + 10px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:50px;padding:0 24px;border-radius:2px;border:1px solid var(--line-2);background:transparent;color:var(--text);font:500 11.5px var(--font);font-stretch:125%;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease)}
.btn:hover{border-color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.white{background:var(--text);color:#000;border-color:var(--text)}
.btn.white:hover{background:#fff}
.btn.white:focus-visible{outline:0;box-shadow:0 0 0 2px #000,0 0 0 3px var(--text)}
.btn.sm{height:44px;padding:0 18px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.35;cursor:default}
.btn .chev{font-size:15px;letter-spacing:0;line-height:1;margin-top:-2px;transition:transform .3s var(--ease)}
.btn:hover .chev{transform:translateX(3px)}
.btn.danger{color:var(--err);border-color:rgba(229,154,141,.4)}.btn.danger:hover{border-color:var(--err)}
.ulink{display:inline-flex;align-items:center;gap:12px;font-stretch:125%;font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding:0 0 4px;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;transition:background-size .4s var(--ease);border:0;color:inherit;cursor:pointer}
.ulink:hover{background-size:0 1px;background-position:100% 100%}
.ulink.plain{background:none;padding:12px 0}
.ulink:disabled{opacity:.3;cursor:default}
.ulink.inline{font-stretch:100%;font-size:inherit;letter-spacing:0;text-transform:none;font-weight:inherit;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:8px 18px;border:1px solid var(--line-2);border-radius:2px;background:transparent;color:var(--muted);font:500 11.5px var(--font);font-stretch:125%;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.opt:hover{color:var(--text);border-color:var(--text)}
.opt[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text)}

/* ---------- header ---------- */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
.nav.solid{background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom-color:var(--line)}
.nav-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.mark{justify-self:center;font-stretch:125%;font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.menu-trigger,.mx-close{justify-self:start;display:inline-flex;align-items:center;gap:14px;background:none;border:0;color:var(--text);cursor:pointer;padding:12px 0;font:500 11.5px var(--font);font-stretch:125%;letter-spacing:var(--cap-ls);text-transform:uppercase}
.menu-trigger i{display:grid;gap:6px;width:26px}
.menu-trigger i::before,.menu-trigger i::after{content:"";height:1px;background:currentColor;display:block;transition:transform .4s var(--ease)}
.menu-trigger:hover i::after{transform:scaleX(.6);transform-origin:left}
.mx-close i{position:relative;width:20px;height:20px}
.mx-close i::before,.mx-close i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:currentColor;transform:rotate(45deg)}
.mx-close i::after{transform:rotate(-45deg)}
.nav-ctx{justify-self:end;display:inline-flex;align-items:center;gap:10px;font-stretch:125%;font-size:11.5px;font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;padding:12px 0;--ar-w:18px}
.nav-ctx.off{visibility:hidden}
@media (max-width:640px){.mark{font-size:12px;letter-spacing:.3em}.menu-trigger span,.nav-ctx .t,.mx-close span{display:none}}

/* ---------- motion ---------- */
.rv{opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:var(--d,0ms)}
.in .rv{opacity:1;transform:none}
.lesson[data-dir="next"] .rv{transform:translateX(44px)}
.lesson[data-dir="back"] .rv{transform:translateX(-44px)}
.lesson.in .rv{transform:none}
.mask{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.mask > span{display:block;transform:translateY(108%);transition:transform .9s var(--ease)}
.in .mask > span{transform:none}
.out{opacity:0;transition:opacity .18s var(--ease-in)}

/* ---------- menu: curtain wipe, words and cards travel rightward into place ---------- */
.mx{position:fixed;inset:0;z-index:90;color:var(--text)}
.mx-curtain{position:absolute;inset:0;background:var(--surface);clip-path:inset(0 100% 0 0);transition:clip-path .55s var(--ease)}
.mx.open .mx-curtain{clip-path:inset(0)}
.mx-in{position:relative;height:100%;display:grid;grid-template-rows:76px 1fr auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
.mx-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.mx-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;align-items:center;min-height:0}
.mx-words{display:grid;gap:2px}
.mx-words a{display:flex;align-items:baseline;gap:22px;font-stretch:125%;font-weight:300;font-size:clamp(34px,5vw,72px);line-height:1.02;text-transform:uppercase;letter-spacing:.01em;opacity:0;transform:translateX(-90px);transition:opacity .6s var(--ease),transform .7s var(--ease),color .25s ease;transition-delay:var(--d)}
.mx-words a small{font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);color:var(--dim)}
.mx-words a[aria-current="page"] small{color:var(--text)}
.mx-words:hover a:not(:hover){color:#5A5A58}
.mx-box{display:grid;gap:12px;align-content:center}
.mx-card{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 18px 14px 14px;border:1px solid var(--line);background:var(--surface-2);opacity:0;transform:translateX(-70px);transition:opacity .6s var(--ease),transform .75s var(--ease),border-color .25s;transition-delay:var(--d);--ar-w:18px}
.mx-card:hover{border-color:var(--line-2)}
.mx-card .art{position:relative;height:74px;background:var(--well)}
.mx-card canvas{position:absolute;inset:0;width:100%;height:100%}
.mx-card b{display:block;font-stretch:125%;font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.mx-card .cap{display:block;margin-bottom:6px}
.mx-foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;opacity:0;transition:opacity .5s ease .62s}
.mx-foot a{color:var(--muted);transition:color .2s}.mx-foot a:hover{color:var(--text)}
.mx.open .mx-words a,.mx.open .mx-card{opacity:1;transform:none}
.mx.open .mx-foot{opacity:1}
.mx.closing .mx-words a,.mx.closing .mx-card{opacity:0;transform:translateX(80px);transition:opacity .28s ease,transform .38s var(--ease-in);transition-delay:var(--dc,0ms)}
.mx.closing .mx-foot{opacity:0;transition:opacity .2s ease;transition-delay:0s}
.mx.closing .mx-curtain{clip-path:inset(0 0 0 100%);transition:clip-path .5s var(--ease-in) .26s}
@media (max-width:900px){.mx-grid{grid-template-columns:1fr;align-content:center;gap:40px}.mx-box{display:none}.mx-words a{font-size:clamp(30px,9vw,46px)}}

/* ---------- home: your lesson, the numeral, and the lesson track ---------- */
.one{position:relative;height:100svh;min-height:660px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-rows:1fr auto;padding-top:76px;overflow:hidden}
.one-l{align-self:center;padding-left:var(--gutter);padding-right:24px}
.one-l .when{display:block;margin-bottom:22px}
.one-l h1{font-size:clamp(38px,4.6vw,72px)}
.memory{display:block;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);max-width:32em;color:var(--muted);font-size:15.5px;line-height:1.6;transition:color .2s}
.memory em{font-style:normal;color:var(--text-2)}
.memory:hover{color:var(--text-2)}
.lead-line{margin-top:26px;color:var(--muted);font-size:clamp(17px,1.4vw,20px);line-height:1.55;max-width:30em}
.lead-line em{font-style:normal;color:var(--text)}
.one-l .ctas{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:36px}
.stage-num{align-self:center;justify-self:end;padding-right:var(--gutter)}
.bignum{font-stretch:125%;font-weight:100;font-size:clamp(150px,21vw,330px);line-height:.82;letter-spacing:-.04em;-webkit-mask-image:linear-gradient(#000 40%,rgba(0,0,0,.12));mask-image:linear-gradient(#000 40%,rgba(0,0,0,.12))}
/* the lesson track: the course as a route, one stop per lesson */
.track{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;padding:0 var(--gutter) 44px}
.track .cap{display:block;margin-bottom:18px}
.stops{position:relative;display:flex;justify-content:space-between}
.stops::before,.stops::after{content:"";position:absolute;left:5px;right:5px;top:5px;height:1px;background:var(--line-2);transform-origin:left;transform:scaleX(0);transition:transform 1s var(--ease) .3s}
.stops::after{right:auto;width:calc((100% - 10px) * var(--p,0));background:var(--text)}
.in .stops::before,.in .stops::after{transform:none}
.stop{position:relative;display:grid;justify-items:center;gap:12px;width:34px;color:var(--dim);font-stretch:125%;font-size:11px;font-weight:500;letter-spacing:.1em;opacity:0;transform:translateY(6px);transition:opacity .5s var(--ease),transform .5s var(--ease),color .2s;transition-delay:var(--d)}
.in .stop{opacity:1;transform:none}
.stop i{position:relative;z-index:1;width:11px;height:11px;border-radius:50%;border:1px solid var(--deco);background:var(--bg);transition:transform .25s var(--ease)}
.stop.done{color:var(--muted)}.stop.done i{background:var(--text);border-color:var(--text)}
.stop.now{color:var(--text)}.stop.now i{background:var(--text);border-color:var(--text);box-shadow:0 0 0 5px rgba(255,255,255,.08),0 0 16px rgba(255,255,255,.35)}
a.stop:hover,a.stop:focus-visible{color:var(--text)}
a.stop:hover i{transform:scale(1.25)}
.stop[data-t]::after{content:attr(data-t);position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;padding:7px 10px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);font-stretch:100%;font-size:13px;letter-spacing:0;text-transform:none;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.stop:hover::after,.stop:focus-visible::after{opacity:1;transform:translateX(-50%)}
.track .grp:first-child .stop:first-child::after{left:0;transform:translateY(4px)}
.track .grp:first-child .stop:first-child:hover::after,.track .grp:first-child .stop:first-child:focus-visible::after{transform:none}
.track .grp:last-child .stop:last-child::after{left:auto;right:0;transform:translateY(4px)}
.track .grp:last-child .stop:last-child:hover::after,.track .grp:last-child .stop:last-child:focus-visible::after{transform:none}
@media (max-width:1000px){
  .one{grid-template-columns:1fr;grid-template-rows:auto;height:auto;min-height:100svh;align-content:start}
  .one-l{padding:48px 20px 0}
  .stage-num{justify-self:start;padding:24px 20px 0;order:-1;display:none}
  .track{grid-template-columns:1fr;gap:34px;padding:56px 20px 56px}
}

/* ---------- inner pages ---------- */
.page{padding-top:180px;padding-bottom:120px}
.page-h{display:grid;gap:22px;margin-bottom:56px;max-width:820px}
.page-h h1{font-size:clamp(40px,6vw,84px)}
.page-h p{color:var(--muted);font-size:18px;max-width:34em}
.subtabs{display:flex;gap:34px;padding:6px 6px 0;margin:0 -6px 64px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs a{flex:none;padding:0 0 18px;color:var(--dim);font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .2s}
.subtabs a:hover{color:var(--text)}
.subtabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--text)}
@media (max-width:480px){.subtabs{gap:22px}}
.summary{margin-bottom:28px}

/* course parts and lesson rows */
.rows{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:120px minmax(0,1fr) 140px 40px;gap:24px;align-items:center;padding:40px 0;border-bottom:1px solid var(--line)}
.prow > *{transition:transform .4s var(--ease)}
.prow:hover > *{transform:translateX(6px)}
.prow .no{font-stretch:125%;font-weight:200;font-size:44px;line-height:1;color:var(--deco)}
.prow h2{font-size:clamp(22px,2.6vw,34px)}
.prow p{color:var(--muted);margin-top:8px;max-width:34em}
.prow .cap{text-align:right}
@media (max-width:760px){.prow{grid-template-columns:56px minmax(0,1fr)}.prow .no{font-size:30px}.prow .cap{grid-column:2;text-align:left}.prow .ar{display:none}}
.lrow{display:grid;grid-template-columns:90px minmax(0,1fr) 110px 150px;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
a.lrow:hover .lt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.lrow .no{font-stretch:125%;font-weight:200;font-size:28px;color:var(--deco)}
.lt{font-size:19px}
.state{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.state i{width:7px;height:7px;border-radius:50%;border:1px solid var(--dim)}
.state.done,.state.now{color:var(--text)}
.state.done i{background:var(--text);border-color:var(--text)}
.state.now i{border-color:var(--text);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
@media (max-width:760px){.lrow{grid-template-columns:50px minmax(0,1fr)}.lrow .no{font-size:22px}.lrow .cap{grid-column:2;justify-content:flex-start}}

/* lesson cover */
.intro{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-block:160px 96px}
.intro .big{font-stretch:125%;font-weight:100;font-size:clamp(120px,22vw,300px);line-height:.8;letter-spacing:-.04em;color:#262625}
.intro h1{font-size:clamp(30px,4.6vw,60px);margin-top:-.2em;position:relative}
.intro .q{color:var(--muted);font-size:clamp(18px,1.8vw,21px);max-width:30em;margin-top:28px}
.intro .meta{display:flex;gap:28px;flex-wrap:wrap;align-items:center;margin-top:44px}
.intro .meta a{color:var(--text);padding-bottom:3px;border-bottom:1px solid var(--line-2)}
.intro .meta a:hover{border-bottom-color:var(--text)}
.intro .meta .on{color:var(--text)}
.intro .acts{margin-top:44px}

/* toolkit */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);max-width:760px}
.slot{aspect-ratio:1;background:var(--bg);border:0;color:var(--dim);font:200 clamp(22px,3vw,34px) var(--font);font-stretch:125%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;position:relative;cursor:default}
.slot small{font-stretch:100%;font-size:11px;font-weight:400;letter-spacing:.02em;line-height:1.3;color:var(--deco);padding:0 10px;text-align:center}
.slot.got{color:var(--text);cursor:pointer}
.slot.got small{color:var(--muted)}
.slot.got::after{content:"";position:absolute;top:12px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--text)}
.slot.got:hover,.slot[aria-pressed="true"]{background:var(--raise)}
.slot[aria-pressed="true"]{outline:1px solid var(--text);outline-offset:-1px}
.slot:focus-visible{outline:2px solid var(--text);outline-offset:-4px;z-index:1}
@media (max-width:640px){.slot small{display:none}}
.slot-detail{max-width:760px;margin-top:48px}
.slot-detail h2{font-size:clamp(22px,2.6vw,32px);margin:14px 0 28px}
.slot-detail dl{margin:0;border-top:1px solid var(--line)}
.slot-detail dl div{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.slot-detail dd{margin:0;color:var(--text-2)}
@media (max-width:600px){.slot-detail dl div{grid-template-columns:1fr;gap:6px}}

/* projects */
.stages{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stages div{padding:32px 24px 0 0;display:grid;gap:12px;position:relative}
.stages div::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--dim)}
.stages div.on::before{background:var(--text);border-color:var(--text)}
.stages b{font-stretch:125%;font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.stages p{color:var(--muted);font-size:15px}
@media (max-width:760px){.stages{grid-template-columns:1fr 1fr;row-gap:32px}}
.footnote{margin-top:72px;color:var(--muted)}

/* about: one page, four sections */
.lede{font-size:clamp(22px,2.6vw,32px);font-weight:300;line-height:1.45;max-width:24em}
.lede span{color:var(--dim)}
.about-sec{margin-top:120px;scroll-margin-top:110px}
.about-sec > h2{font-size:clamp(22px,2.4vw,30px);margin-bottom:28px}
.short{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);max-width:760px}
.short li{display:grid;grid-template-columns:80px 1fr;gap:20px;padding:26px 0;border-bottom:1px solid var(--line);font-size:18px}
.short li .cap{padding-top:5px}
.faq{border-top:1px solid var(--line);max-width:860px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 0;cursor:pointer;font-size:19px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:11px;height:11px;flex:none;background:linear-gradient(var(--text),var(--text)) center/11px 1px no-repeat,linear-gradient(var(--text),var(--text)) center/1px 11px no-repeat;transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding-bottom:28px;max-width:40em}

/* ---------- lesson view ---------- */
.lbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.lbar-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;height:68px}
.lbar .t{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.lbar .r{justify-self:end;display:flex;align-items:center;gap:10px}
.lbar .r i{width:6px;height:6px;border-radius:50%;background:var(--text)}
.lbar .ulink{color:var(--muted)}
@media (max-width:480px){.lbar .r{font-size:0;gap:0}}
.rule{height:1px;background:var(--line)}
.rule i{display:block;height:100%;background:var(--text);transition:width .5s var(--ease)}
.lesson{max-width:700px;margin:0 auto;padding:180px 24px 160px}
@media (max-width:640px){.lesson{padding:140px 20px}}
.lesson h1{font-size:clamp(28px,4vw,46px);margin-top:20px}
.body p{color:var(--text-2);font-size:18px;line-height:1.75;margin-top:22px}
.body p:first-child{margin-top:36px}
.body p.muted{color:var(--muted)}
.pairs{margin-top:48px;border-top:1px solid var(--line)}
.pairs div{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.pairs p{color:var(--text-2)}
.pairs .good{color:var(--text)}
@media (max-width:560px){.pairs div{grid-template-columns:1fr;gap:8px}}
.prompt{margin-top:40px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:20px;font-weight:300}
.field-lbl{display:block;margin-top:36px}
textarea{width:100%;margin-top:24px;min-height:120px;background:transparent;border:0;border-bottom:1px solid var(--line-2);color:var(--text);font:inherit;font-size:17px;padding:12px 0;resize:vertical}
.field-lbl + textarea{margin-top:4px;min-height:60px}
textarea:focus{outline:none;border-bottom-color:var(--text)}
textarea:focus-visible{box-shadow:0 1px 0 var(--text)}
.convo{margin-top:40px;border:1px solid var(--line);padding:24px 28px;display:grid;gap:18px}
.convo div{display:grid;grid-template-columns:110px 1fr;gap:16px}
.convo p{color:var(--text-2)}
.jobs{list-style:none;padding:0;margin:40px 0 0;border-top:1px solid var(--line)}
.job{padding:24px 0;border-bottom:1px solid var(--line);display:grid;gap:16px}
.job p{font-size:17px}
.verdict{font-stretch:125%;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.verdict.no{color:var(--muted)}
.answers{display:grid;gap:10px;margin-top:40px}
.answer{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;text-align:left;width:100%;padding:22px 24px;border:1px solid var(--line-2);background:transparent;color:var(--text);font:inherit;font-size:16.5px;cursor:pointer;transition:border-color .2s}
.answer:hover{border-color:var(--text)}
.answer .k{font-stretch:125%;font-size:12px;letter-spacing:.2em;color:var(--muted);padding-top:3px}
.answer[aria-pressed="true"]{border-color:var(--text);background:var(--raise)}
.answer:disabled{cursor:default}
.outcome{margin-top:28px;padding:24px 0;border-top:1px solid var(--text);color:var(--text-2)}
.outcome:focus{outline:none}
.outcome .cap{display:block;margin-bottom:10px;color:var(--text)}
.mt{margin-top:32px}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:80px;padding-top:28px;border-top:1px solid var(--line)}
.lfoot .ulink{color:var(--muted)}.lfoot .ulink:hover{color:var(--text)}

/* ---------- forms: sign in, join, reset ---------- */
.auth{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-top:76px}
.auth-l{padding:120px var(--gutter) 64px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.auth-l h1{font-size:clamp(40px,5.2vw,84px);overflow-wrap:anywhere}
.auth-l p{color:var(--muted);font-size:18px;margin-top:22px;max-width:22em}
.auth-r{padding:120px var(--gutter) 64px 64px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-l{border-right:0;padding:56px 20px 0}.auth-r{padding:40px 20px 64px}}
.form{display:grid;gap:30px;max-width:460px;width:100%}
.fld{display:grid;gap:10px}
.fld label,.fld .lbl{font-stretch:125%;font-size:var(--cap-fs);font-weight:500;letter-spacing:var(--cap-ls);text-transform:uppercase;color:var(--muted)}
.input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);color:var(--text);font:400 19px var(--font);padding:10px 0 12px;border-radius:0;transition:border-color .25s}
.input:focus{outline:none;border-bottom-color:var(--text)}
.input[aria-invalid="true"]{border-bottom-color:var(--err-line)}
.fld .row{display:flex;align-items:center;gap:12px}
.fld .row .input{flex:1}
.hint{font-size:14px;color:var(--muted)}
.err{font-size:14px;color:var(--err)}
.chk{display:flex;gap:14px;align-items:flex-start;cursor:pointer;color:var(--text-2);font-size:15.5px}
.chk input{appearance:none;width:20px;height:20px;border:1px solid var(--line-2);border-radius:2px;flex:none;margin-top:1px;display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--text);border-color:var(--text)}
.chk input:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid #000;border-bottom:1.5px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.notice{border-left:1px solid var(--text);padding:6px 0 6px 18px;color:var(--text-2);font-size:15px}
.notice:focus{outline:none}
.pwmeter{display:flex;gap:6px}.pwmeter i{flex:1;height:2px;background:var(--track);transition:background .3s}.pwmeter i.on{background:var(--text)}

.auth-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;height:76px}
.auth-top .ulink{color:var(--muted)}.auth-top .ulink:hover{color:var(--text)}
.demo{margin-top:56px;max-width:460px;border-top:1px solid var(--line);padding-top:18px}
.demo summary{cursor:pointer;list-style:none}.demo summary::-webkit-details-marker{display:none}
.demo summary::after{content:" +";color:var(--dim)}.demo[open] summary::after{content:" –"}
.demo ul{list-style:none;padding:0;margin:16px 0 0}
.demo li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.demo li b{display:block;font-weight:400}
.demo .hint{display:block}
.demo > .hint{margin-top:14px}

/* ---------- settings ---------- */
.set-row{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:28px;align-items:center;padding:30px 0;border-bottom:1px solid var(--line)}
.set-row:first-child{border-top:1px solid var(--line)}
.set-row .k{font-stretch:125%;font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.set-row .v{color:var(--muted);font-size:16px}
.set-row .v b{color:var(--text);font-weight:400}
.set-row .input{width:min(320px,100%);padding-block:6px}
@media (max-width:760px){.set-row{grid-template-columns:1fr;gap:12px}}
#out{margin-top:28px}

/* ---------- learner preferences ---------- */
html.text-lg body{font-size:18.5px}
