<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{background:#000}</style>
<title>LearningAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..700;1,62..125,300&display=swap">
<style>
/* Concept: a hypercar maker's site, for learning. Pure black and white, no accent colour.
   One family (Archivo): extended light capitals for display and labels, normal width for reading.
   Home is full-screen panels with point-cloud turntables; one idea and one action per screen. */
:root{
  --bg:#000000; --raise:#0B0B0B; --text:#F4F4F2; --muted:#8E8E8B; --dim:#777774; --deco:#4A4A48;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --wrap:1200px; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#000;scroll-padding-top:100px;scrollbar-color:#333 transparent}
::selection{background:#F4F4F2;color:#000}
textarea,input{caret-color:#F4F4F2}
.btn.ghostpill:hover{background:rgba(255,255,255,.06)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-stretch:100%;font-weight:400;font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:32px}
@media (max-width:640px){.wrap{padding-inline:20px}}
h1,h2,h3{margin:0;font-stretch:125%;font-weight:300;text-transform:uppercase;letter-spacing:.02em;line-height:1.08;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--text);outline-offset:4px}
.cap{font-stretch:125%;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px}.skip:focus{left:20px;top:16px;z-index:90;background:var(--text);color:var(--bg);padding:8px 14px}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* nav */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom-color:var(--line)}
.nav-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.mark{font-stretch:125%;font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.links{display:flex;gap:38px}
.links a{font-stretch:125%;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:8px 0;position:relative;transition:color .25s}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--text);transform:scaleX(0);transition:transform .3s ease}
.links a:hover,.links a[aria-current="page"]{color:var(--text)}
.links a[aria-current="page"]::after,.links a:hover::after{transform:scaleX(1)}
.nav-r{justify-self:end;display:flex;gap:24px;align-items:center}
.btn.menu-btn{display:none}
.nav-r .signin{white-space:nowrap}
@media (max-width:1100px){.links{gap:26px}.nav-r .signin{display:none}}
@media (max-width:900px){
  .nav-in{grid-template-columns:1fr auto}
  .links{display:none}
  .btn.menu-btn{display:inline-flex}
}
.overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 40px}
.overlay .top{display:flex;justify-content:space-between;align-items:center;height:34px}
.overlay nav{display:grid;margin-top:56px}
.overlay nav a{font-stretch:125%;font-weight:300;font-size:34px;text-transform:uppercase;letter-spacing:.02em;padding:14px 0;border-bottom:1px solid var(--line)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:48px;padding:0 28px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--text);font:500 11px var(--font);font-stretch:125%;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.btn:hover{border-color:var(--text)}
.btn.white{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.white:hover{background:#fff}
.btn.sm{height:38px;padding:0 20px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.link{display:inline-flex;align-items:center;gap:12px;font-stretch:125%;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.link .ar{display:inline-block;width:28px;height:1px;background:currentColor;position:relative;transition:width .3s}
.link .ar::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.link:hover .ar{width:40px}

/* hero */
.hero{position:relative;height:min(100vh,920px);min-height:600px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:72px}
.hero h1{font-size:clamp(40px,6.6vw,96px);max-width:9.5em;letter-spacing:.01em}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-top:34px}
.hero-row p{max-width:30em;color:var(--muted);font-size:17px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.resume{position:absolute;top:110px;right:32px;display:flex;align-items:center;gap:12px;padding:10px 18px;border:1px solid var(--line-2);border-radius:999px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.resume i{width:6px;height:6px;border-radius:50%;background:var(--text);}
@keyframes pulse{50%{opacity:.25}}
@media (max-width:640px){.resume{position:static;align-self:flex-start;margin-bottom:28px}.hero .wrap{justify-content:flex-end}}

/* spec sheet */
.specs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.specs div{padding:44px 0 40px 32px;border-left:1px solid var(--line)}
.specs div:first-child{border-left:0;padding-left:0}
.specs b{display:block;font-stretch:125%;font-weight:200;font-size:clamp(40px,5vw,68px);line-height:1;letter-spacing:-.01em}
.specs b small{font-size:.32em;font-weight:400;letter-spacing:.12em;margin-left:6px;color:var(--muted)}
.specs .cap{display:block;margin-top:16px}
@media (max-width:860px){.specs{grid-template-columns:1fr 1fr}.specs div:nth-child(3){border-left:0;padding-left:0}.specs div:nth-child(n+3){border-top:1px solid var(--line)}}

/* sections */
.sec{padding-block:140px 0}
@media (max-width:700px){.sec{padding-block:96px 0}}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:56px}
.sec-head h2{font-size:clamp(28px,3.6vw,48px)}
.parts{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:120px minmax(0,1fr) 180px 40px;gap:24px;align-items:center;padding:40px 0;border-bottom:1px solid var(--line)}
.prow > *{transition:transform .4s var(--ease)}.prow:hover > *{transform:translateX(6px)}
.prow .no{font-stretch:125%;font-weight:200;font-size:44px;line-height:1;color:var(--deco)}
.prow h3{font-size:clamp(22px,2.6vw,34px)}
.prow p{color:var(--muted);margin-top:8px;max-width:34em}
.prow .meta{text-align:right}
.prow .meta span{display:block}
@media (max-width:760px){.prow{grid-template-columns:60px minmax(0,1fr)}.prow .no{font-size:30px}.prow .meta,.prow .go{grid-column:2;text-align:left}.prow .go{display:none}}
.statement{padding-block:160px;text-align:center}
.statement p{font-stretch:125%;font-weight:200;font-size:clamp(26px,3.6vw,46px);line-height:1.25;text-transform:uppercase;letter-spacing:.02em;max-width:22em;margin:0 auto}
.statement p span{color:var(--dim)}
.closing{border-top:1px solid var(--line);padding-block:110px;display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.closing h2{font-size:clamp(26px,3.4vw,44px)}
footer{border-top:1px solid var(--line);padding-block:36px 48px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.foot nav{display:flex;gap:28px;flex-wrap:wrap}
.foot nav a{color:var(--dim);transition:color .2s}.foot nav a:hover{color:var(--text)}

/* inner pages */
.page{padding-top:200px}
.page-h{display:grid;gap:22px;margin-bottom:80px;max-width:820px}
.page-h h1{font-size:clamp(40px,6vw,84px)}
.page-h p{color:var(--muted);font-size:18px;max-width:34em}
.filters{display:flex;gap:30px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.filters button{background:none;border:0;padding:0 0 16px;color:var(--dim);font:500 11px var(--font);font-stretch:125%;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px}
.filters button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.group{margin-top:72px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.group-h h2{font-size:clamp(22px,2.4vw,30px)}
.lrow{display:grid;grid-template-columns:90px minmax(0,1fr) 110px 150px;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
a.lrow:hover .lt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.lrow .no{font-stretch:125%;font-weight:200;font-size:28px;color:var(--deco)}
.lt{font-size:19px;font-weight:400;letter-spacing:-.005em}
.lq{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.lrow .min{color:var(--dim)}
.state{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.state i{width:7px;height:7px;border-radius:50%;border:1px solid var(--dim)}
.state.done i{background:var(--text);border-color:var(--text)}
.state.now i{border-color:var(--text);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.state.done,.state.now{color:var(--text)}
@media (max-width:760px){.lrow{grid-template-columns:50px minmax(0,1fr)}.lrow .no{font-size:22px}.lrow .min,.lrow .state{grid-column:2;justify-content:flex-start}}

.gauge-row{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:80px;align-items:center}
.gauge{position:relative;aspect-ratio:1;max-width:380px}
.gauge svg{width:100%;height:100%}
.gauge .read{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .read b{font-stretch:125%;font-weight:200;font-size:clamp(56px,8vw,96px);line-height:1}
.readouts{display:grid;border-top:1px solid var(--line)}
.readouts div{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}
.readouts b{font-stretch:125%;font-weight:300;font-size:26px}
@media (max-width:860px){.gauge-row{grid-template-columns:1fr;gap:48px}.gauge{max-width:300px}}
.resume-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding:48px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin-top:96px}
.resume-card h2{font-size:clamp(26px,3.4vw,44px);margin-top:16px}
.resume-card p{color:var(--muted);margin-top:12px}
@media (max-width:700px){.resume-card{grid-template-columns:1fr}}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px}
.kit article{background:var(--bg);padding:32px;display:grid;gap:18px;align-content:start}
.kit h3{font-size:18px}
.kit dl{margin:0;display:grid;gap:14px}.kit dd{margin:4px 0 0;color:#D6D6D3}
.stages{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stages div{padding:32px 24px 0 0;display:grid;gap:12px;position:relative}
.stages div::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--dim)}
.stages div.on::before{background:var(--text);border-color:var(--text)}
.stages b{font-stretch:125%;font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.stages p{color:var(--muted);font-size:15px}
@media (max-width:760px){.stages{grid-template-columns:1fr 1fr;row-gap:32px}}
.empty{border:1px solid var(--line);padding:72px 32px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:80px}
.two h3{font-size:20px;margin-bottom:24px}
.two ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.two li{padding:18px 0;border-bottom:1px solid var(--line);color:#D6D6D3}
@media (max-width:760px){.two{grid-template-columns:1fr;gap:56px}}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px 0;cursor:pointer;font-size:19px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";width:11px;height:11px;flex:none;background:linear-gradient(var(--text),var(--text)) center/11px 1px no-repeat,linear-gradient(var(--text),var(--text)) center/1px 11px no-repeat;transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding-bottom:28px;max-width:40em}

/* lesson view */
.lbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.lbar-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:68px}
.lbar .t{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.lbar .r{justify-self:end;display:flex;align-items:center;gap:10px}
.lbar .r i{width:6px;height:6px;border-radius:50%;background:var(--text)}
.rule{height:1px;background:var(--line)}
.rule i{display:block;height:100%;background:var(--text);transition:width .5s ease}
.lesson{max-width:700px;margin:0 auto;padding:180px 24px 160px}
@media (max-width:640px){.lesson{padding:140px 20px 140px}.lbar .t{max-width:46vw}}
.lesson h1{font-size:clamp(28px,4vw,46px);margin-top:20px}
.lesson .body p{color:#CFCFCC;font-size:18px;line-height:1.75;margin-top:22px}
.lesson .body p:first-child{margin-top:36px}
.pairs{margin-top:48px;border-top:1px solid var(--line)}
.pairs div{display:grid;grid-template-columns:170px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.pairs div p{color:#CFCFCC}
@media (max-width:560px){.pairs div{grid-template-columns:1fr;gap:8px}}
.prompt{margin-top:40px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:20px;font-weight:300}
textarea{width:100%;margin-top:24px;min-height:120px;background:transparent;border:0;border-bottom:1px solid var(--line-2);color:var(--text);font:inherit;font-size:17px;padding:12px 0;resize:vertical}
textarea:focus{outline:none;border-bottom-color:var(--text)}
.convo{margin-top:40px;border:1px solid var(--line);padding:24px 28px;display:grid;gap:18px}
.convo div{display:grid;grid-template-columns:110px 1fr;gap:16px}
.convo p{color:#E6E6E3}
.jobs{list-style:none;padding:0;margin:40px 0 0;border-top:1px solid var(--line)}
.job{padding:24px 0;border-bottom:1px solid var(--line);display:grid;gap:16px}
.job p{font-size:17px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--muted);font:500 11px var(--font);font-stretch:125%;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.choice:hover{color:var(--text);border-color:var(--text)}
.choice[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.choice:disabled{cursor:default}
.verdict{font-stretch:125%;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.verdict.no{color:var(--muted)}
.answers{display:grid;gap:10px;margin-top:40px}
.answer{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;text-align:left;width:100%;padding:22px 24px;border:1px solid var(--line-2);background:transparent;color:var(--text);font:inherit;font-size:16.5px;cursor:pointer;transition:border-color .2s}
.answer:hover{border-color:var(--text)}
.answer .k{font-stretch:125%;font-size:12px;letter-spacing:.2em;color:var(--muted);padding-top:3px}
.answer[aria-pressed="true"]{border-color:var(--text);background:var(--raise)}
.answer:disabled{cursor:default}
.outcome{margin-top:28px;padding:24px 0;border-top:1px solid var(--text);color:#E6E6E3}
.outcome .cap{display:block;margin-bottom:10px;color:var(--text)}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:80px;padding-top:28px;border-top:1px solid var(--line)}
.lfoot button.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:12px 0}
.lfoot button.link:hover{color:var(--text)}
.lfoot button.link:disabled{opacity:.3;cursor:default}
.rev .ar{transform:scaleX(-1)}

/* sub-tabs, intro, slots, minimal pages */
.subtabs{display:flex;gap:34px;border-bottom:1px solid var(--line);margin-bottom:64px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs a{flex:none;padding:0 0 18px;color:var(--dim);font-stretch:125%;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .2s}
.subtabs a:hover{color:var(--text)}
.subtabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--text)}
.page.tight{padding-top:180px}
.page-h.min{margin-bottom:56px}
.hero.solo{height:100vh;max-height:none;border-bottom:0}
.hero.solo .wrap{padding-bottom:96px}
.scroll-cue{position:absolute;left:50%;bottom:28px;width:1px;height:40px;background:linear-gradient(var(--text),transparent);opacity:.5}
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-block:160px 96px}
.intro .big{font-stretch:125%;font-weight:100;font-size:clamp(120px,22vw,300px);line-height:.8;letter-spacing:-.04em;color:#262625}
.intro h1{font-size:clamp(30px,4.6vw,60px);margin-top:-.2em;position:relative}
.intro .q{color:var(--muted);font-size:clamp(18px,1.8vw,21px);max-width:30em;margin-top:28px}
.intro .meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:44px}
.intro .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:44px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);max-width:760px}
.slot{aspect-ratio:1;background:var(--bg);border:0;color:var(--dim);font:200 clamp(22px,3vw,34px) var(--font);font-stretch:125%;display:grid;place-items:center;position:relative;cursor:default}
.slot.got{color:var(--text);cursor:pointer}
.slot.got::after{content:"";position:absolute;top:12px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--text)}
.slot.got:hover,.slot[aria-pressed="true"]{background:var(--raise)}
.slot[aria-pressed="true"]{outline:1px solid var(--text);outline-offset:-1px}
.slot-detail{max-width:760px;margin-top:48px}
.slot-detail h2{font-size:clamp(22px,2.6vw,32px);margin:14px 0 28px}
.slot-detail dl{margin:0;border-top:1px solid var(--line)}
.slot-detail dl div{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.slot-detail dd{margin:0;color:#D6D6D3}
@media (max-width:600px){.slot-detail dl div{grid-template-columns:1fr;gap:6px}}
.lede{font-size:clamp(22px,2.6vw,32px);font-weight:300;line-height:1.45;max-width:24em;color:var(--text)}
.lede span{color:var(--dim)}
.short{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);max-width:760px}

.ticks i{width:2px;height:30px;background:#2A2A29;transform-origin:bottom;transform:scaleY(.15);transition:transform .7s var(--ease),background .4s;transition-delay:var(--d)}
.in .ticks i{transform:none}
.ticks i.d{background:var(--text)}
.ticks i.n{background:var(--text);height:44px;margin-top:-14px;box-shadow:0 0 12px rgba(255,255,255,.45)}
.stage-num .cap{margin-top:22px}
@media (max-width:1000px){.stage-num{padding:28px 20px 8px}.bignum{font-size:clamp(120px,38vw,220px)}.ticks{gap:14px}.ticks .grp{gap:5px}}

/* ===== forms: sign in, create account, settings ===== */
.auth{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-top:76px}
.auth-l{padding:120px max(32px,calc((100vw - 1200px)/2 + 32px)) 64px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.auth-l h1{font-size:clamp(40px,5.2vw,84px);overflow-wrap:anywhere}
.auth-l p{color:var(--muted);font-size:18px;margin-top:22px;max-width:22em}
.auth-r{padding:120px max(32px,calc((100vw - 1200px)/2 + 32px)) 64px 64px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-l{border-right:0;padding:56px 20px 0}.auth-r{padding:40px 20px 64px}}
.form{display:grid;gap:30px;max-width:460px;width:100%}
.fld{display:grid;gap:10px}
.fld label,.fld .lbl{font-stretch:125%;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.fld input[type=text],.fld input[type=email],.fld input[type=password]{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);color:var(--text);font:400 19px var(--font);padding:10px 0 12px;border-radius:0;transition:border-color .25s}
.fld input:focus{outline:none;border-bottom-color:var(--text)}
.fld input[aria-invalid="true"]{border-bottom-color:#B85C4F}
.fld .row{display:flex;align-items:center;gap:12px}
.fld .row input{flex:1}
.fld .hint{font-size:14px;color:var(--muted)}
.fld .err{font-size:14px;color:#E59A8D}
.reveal-pw{background:none;border:0;color:var(--muted);font:500 11px var(--font);font-stretch:125%;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:12px 0}
.reveal-pw:hover{color:var(--text)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:44px;padding:0 18px;border:1px solid var(--line-2);border-radius:2px;background:transparent;color:var(--muted);font:500 11.5px var(--font);font-stretch:125%;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.opt:hover{color:var(--text);border-color:var(--text)}
.opt[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text)}
.chk{display:flex;gap:14px;align-items:flex-start;cursor:pointer;color:#D6D6D3;font-size:15.5px}
.chk input{appearance:none;width:20px;height:20px;border:1px solid var(--line-2);border-radius:2px;flex:none;margin-top:1px;display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--text);border-color:var(--text)}
.chk input:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid #000;border-bottom:1.5px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.chk input:focus-visible{outline:1px solid var(--text);outline-offset:3px}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.notice{border-left:1px solid var(--text);padding:6px 0 6px 18px;color:#D6D6D3;font-size:15px}
.pwmeter{display:flex;gap:6px}.pwmeter i{flex:1;height:2px;background:#2A2A29;transition:background .3s}.pwmeter i.on{background:var(--text)}
.set-row{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:28px;align-items:center;padding:30px 0;border-bottom:1px solid var(--line)}
.set-row:first-child{border-top:1px solid var(--line)}
.set-row .k{font-stretch:125%;font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.set-row .v{color:var(--muted);font-size:16px}
.set-row .v b{color:var(--text);font-weight:400}
@media (max-width:760px){.set-row{grid-template-columns:1fr;gap:12px}}
.danger{color:#E59A8D;border-color:rgba(229,154,141,.4)}
.danger:hover{border-color:#E59A8D}
html.text-lg body{font-size:18.5px}
html.text-lg .lead-line,html.text-lg .set-row .v{font-size:19px}
html.calm *,html.calm *::before,html.calm *::after{transition:none!important;animation:none!important}
html.calm .rv,html.calm .mask>span,html.calm .ticks i,html.calm .mx-words a,html.calm .mx-card,html.calm .mx-foot{opacity:1!important;transform:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
