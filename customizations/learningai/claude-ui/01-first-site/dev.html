<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lab-bench app. Quiet paper-white pages, cobalt for actions, highlighter yellow for the one thing to notice; labs sit on graph-paper surfaces. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#101828; --muted:#4A5568; --line:#D6DCE5; --grid:rgba(39,71,216,.07);
  --accent:#2747D8; --on-accent:#FFFFFF; --accent-soft:#E3E8FD;
  --signal:#FFD84D; --signal-ink:#2E2400;
  --good:#16794A; --good-soft:#E1F3EA; --bad:#C2410C; --bad-soft:#FCE9DF; --lab:#F7F9FC;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#151B2C; --ink:#E9EDF5; --muted:#A3AEC2; --line:#2A3349; --grid:rgba(143,166,255,.07);
  --accent:#8FA6FF; --on-accent:#0D1220; --accent-soft:#1E2A52; --signal:#F2C94C; --signal-ink:#231B00;
  --good:#5FD39A; --good-soft:#132E20; --bad:#FF8F5E; --bad-soft:#3A1E12; --lab:#111829; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151B2C; --ink:#E9EDF5; --muted:#A3AEC2; --line:#2A3349; --grid:rgba(143,166,255,.07);
  --accent:#8FA6FF; --on-accent:#0D1220; --accent-soft:#1E2A52; --signal:#F2C94C; --signal-ink:#231B00;
  --good:#5FD39A; --good-soft:#132E20; --bad:#FF8F5E; --bad-soft:#3A1E12; --lab:#111829; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding:0 16px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:14.5px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:9;background:var(--surface);padding:8px 12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo svg{flex:none}
.nav{display:flex;gap:4px}
.nav a{color:var(--ink);text-decoration:none;font-weight:600;padding:8px 12px;border-radius:8px}
.nav a:hover{background:var(--accent-soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.save-chip{margin-left:auto;font-size:13px;font-family:var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center}
.save-chip.ok span{color:var(--good)}.save-chip.bad{color:var(--bad)}

main{max-width:1120px;margin:0 auto;padding-block:36px 72px}
footer{max-width:1120px;margin:0 auto;border-top:1px solid var(--line);padding-block:20px 40px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* buttons & fields */
.btn{display:inline-flex;text-align:center;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);color:var(--ink);font:600 15px var(--body);text-decoration:none;cursor:pointer;transition:transform .12s ease,background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:var(--line)}
.btn.lg{min-height:52px;padding:0 22px;font-size:16.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.danger-btn{border-color:var(--bad);color:var(--bad)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.input{width:100%;font:16px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;line-height:1.5}
.input.mono{font-family:var(--mono);font-size:15px}
.fld-label{display:block;font-weight:700;margin-bottom:6px;font-size:15.5px}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:4px}
.pill{font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.prog{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.skill{font-size:12px;color:var(--accent);font-weight:600}
.lab-surface{background-color:var(--lab);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:var(--r)}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:12px 40px}
.hero h1{font-size:clamp(44px,7vw,84px);font-weight:800;letter-spacing:-.035em;line-height:.98;margin-bottom:20px}
.hl{background:linear-gradient(transparent 82%,var(--signal) 82%,var(--signal) 96%,transparent 96%);padding:0 .06em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero-sub{font-size:19px;max-width:34em;color:var(--ink);margin-bottom:24px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.hero-demo{padding:22px;min-width:0;box-shadow:0 18px 40px -24px rgba(16,24,40,.35)}
.demo-label{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.mini-note{margin-top:14px;font-size:15px;padding:12px 14px;background:var(--surface);border-left:4px solid var(--signal);border-radius:0 8px 8px 0}
section + section{margin-top:64px}
section h2{font-size:clamp(26px,3.6vw,36px);font-weight:800}
.loop h2{margin-bottom:20px}
.loop-steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:lp;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.loop-steps li{padding:20px;counter-increment:lp;display:flex;flex-direction:column;gap:6px;position:relative}
.loop-steps li + li{border-left:1.5px solid var(--ink)}
.loop-steps li::before{content:counter(lp);font-family:var(--mono);font-size:13px;color:var(--muted)}
.loop-steps b{font-family:var(--display);font-size:24px;font-weight:800}
.loop-steps span{color:var(--muted);font-size:15px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.lesson-grid{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lcard{display:flex;flex-direction:column;gap:8px;height:100%;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.lcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lnum{font-weight:600;font-size:13px;color:var(--muted)}
.lcard-t{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.lcard-s{color:var(--muted);font-size:15px;flex:1}
.teachers h2{margin-bottom:18px}
.t-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.t-grid b{display:block;margin-bottom:6px;font-size:17px}
.t-grid p{color:var(--muted);font-size:15.5px}

/* course & notebook */
.page-head{margin-bottom:28px}
.page-head h1{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.lede{max-width:40em;color:var(--muted);font-size:18px}
.progress-line{display:flex;align-items:center;gap:14px;max-width:520px}
.bar{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.resume{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;gap:2px 18px;align-items:center;padding:20px 22px;margin-bottom:28px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);color:var(--ink);text-decoration:none;box-shadow:6px 6px 0 var(--signal)}
.resume .eyebrow{margin:0}.resume .btn{grid-column:2;grid-row:1/4}
.resume-t{font-family:var(--display);font-weight:800;font-size:24px}
.resume.done{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.course-list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.crow a{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.crow a:hover{background:var(--surface)}
.crow-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.crow-t{font-family:var(--display);font-weight:800;font-size:19px}
.crow-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.nb{display:grid;gap:14px;margin-top:18px}
.nb-entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.nb-entry h3{font-size:18px;margin:8px 0 6px}
.empty{padding:28px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.danger{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.danger h2{font-size:20px}

/* lesson */
.lesson{max-width:860px;margin:0 auto}
.lesson-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{font-weight:600;text-decoration:none;padding:8px 0}
.steps-track{list-style:none;padding:0;margin:0 0 22px;display:flex;gap:6px}
.steps-track li{flex:1}
.track-btn{width:100%;height:24px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center}
.track-btn:disabled{cursor:default}
.track-btn i{display:block;width:100%;height:8px;border-radius:999px;background:var(--line)}
.is-done .track-btn i{background:var(--accent)}
.is-current .track-btn i{background:var(--signal);outline:2px solid var(--ink);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,36px)}
.card h2{font-size:clamp(26px,3.8vw,36px);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
.card h2:focus{outline:none}
.prose p{font-size:18.5px;max-width:36em;margin-bottom:14px}
.points{margin:18px 0 0;padding:16px 18px 16px 36px;background:var(--bg);border-radius:var(--r)}
.points li{margin:4px 0}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;min-height:52px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:17px/1.4 var(--body);cursor:pointer;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt-mark{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:600 14px var(--mono);background:var(--bg);border:1px solid var(--line)}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right .opt-mark{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .opt-mark{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.dim{opacity:.6}
.reveal{padding:16px 18px;border-radius:var(--r);border-left:5px solid var(--good);background:var(--good-soft)}
.reveal.no{border-left-color:var(--signal);background:var(--bg)}
.reveal:focus{outline:none}
.reveal-h{font-weight:700;margin-bottom:6px}
.reveal p + p{margin-top:8px}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.next-why{text-align:right;margin-top:8px}
.task{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;margin-bottom:18px;background:var(--signal);color:var(--signal-ink);border-radius:var(--r)}
.task-tag{flex:none;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
.lab-body{padding:clamp(14px,3vw,22px)}
.lesson .lab{max-width:none}
.finish h2{margin-bottom:14px}
.finish-list{padding-left:20px;margin:0 0 6px;display:grid;gap:6px}

/* segmented buttons (sorting, verdicts, confidence) */
.seg-btns{display:inline-flex;flex-wrap:wrap;gap:6px}
.sb{min-height:40px;padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14px var(--body);cursor:pointer}
.sb:hover:not(:disabled){border-color:var(--ink)}
.sb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sb[aria-pressed="true"]::before{content:"✓ "}
.sb:disabled{cursor:default;opacity:.75}
.sort{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.sort-row{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:8px 16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r)}
.sort-row.ok{border-color:var(--good);background:var(--good-soft)}
.sort-row.no{border-color:var(--bad);background:var(--bad-soft)}
.sort-t{font-weight:700}
.sort-why{grid-column:1/-1;font-size:15px}

/* classifier */
.clf{display:grid;grid-template-columns:1fr 250px;gap:20px}
.clf-canvas{min-width:0;display:flex;flex-direction:column;gap:4px}
.clf-canvas canvas{display:block;width:100%;background:var(--surface);border:1.5px solid var(--ink);border-radius:6px;cursor:crosshair}
.axis-x,.axis-y{font:12px var(--mono);color:var(--muted)}
.axis-x{align-self:flex-end;order:3}.axis-y{order:1}.clf-canvas canvas{order:2}
.clf-side{display:flex;flex-direction:column;gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:14px}
.legend span{display:flex;align-items:center;gap:6px}
.lgd{display:inline-block;width:12px;height:12px}
.lgd.sq{background:var(--bad)}.lgd.ci{background:var(--accent);border-radius:50%}.lgd.ring{border:2px solid var(--ink);border-radius:50%}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.seg legend{font-weight:700;font-size:14.5px;margin-bottom:6px;padding:0;width:100%}
.seg label{display:flex;gap:6px;align-items:center;font-size:15px}
.btn-col{display:grid;gap:8px}
.stats{margin:0;display:grid;gap:6px;font-size:14.5px}
.stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.stats dt{color:var(--muted)}.stats dd{margin:0;font-family:var(--mono);text-align:right}
.warn-line{color:var(--bad);font-weight:600}

/* next-word */
.nw-row{display:flex;gap:8px}
.nw-src{margin:10px 0}
.chips{display:grid;gap:6px}
.chip{display:grid;grid-template-columns:minmax(80px,140px) 1fr 48px;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-size:15px}
.chips.mini{margin-top:12px}
.chip:hover{border-color:var(--accent)}
.chip-w{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.chip-bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.chip-bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s ease}
.chip-p{text-align:right;font-size:13.5px;color:var(--muted)}
.nw-gen{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);display:grid;gap:6px;max-width:420px}
.nw-gen .btn{justify-self:start;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-ends{display:flex;justify-content:space-between;font-size:13px}
.nw-train{margin-top:18px}
.nw-train summary{cursor:pointer;font-weight:700;padding:6px 0}
.nw-train textarea{margin-top:4px;font-size:13.5px}

/* calibration */
.cal-list{padding-left:22px;margin:0;display:grid;gap:12px}
.cal-item{padding:4px 0 12px;border-bottom:1px dashed var(--line)}
.cal-s{font-weight:600;margin-bottom:8px}
.cal-ctrl{display:flex;flex-wrap:wrap;gap:8px 18px}
.cal-res{margin-top:6px;font-weight:600}.cal-res.ok{color:var(--good)}.cal-res.no{color:var(--bad)}
.cal-results{margin-top:18px;padding:18px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);display:grid;gap:12px}
.cal-results h4{font-size:20px}
.cal-chart{display:grid;gap:6px}
.cal-row{display:grid;grid-template-columns:110px 120px 1fr;gap:10px;align-items:center;font-size:14.5px}
.cal-row.head{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase}
.cal-bars{display:grid;gap:3px}
.cal-bars i,.cal-key i{display:block;height:8px;border-radius:4px}
.cal-key{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.cal-key i{width:18px;display:inline-block}
.said{background:var(--line);outline:1px solid var(--muted)}.was{background:var(--accent)}
.surebot{padding:14px;border-radius:var(--r);background:var(--bad-soft)}.surebot h4{font-size:17px;margin-bottom:4px}

/* claims */
.ai-answer{margin:0 0 16px;padding:16px 18px;background:var(--surface);border:1.5px dashed var(--ink);border-radius:var(--r)}
.ai-answer figcaption{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.ai-answer blockquote{margin:0;font-size:18px;font-family:var(--display);font-weight:600;line-height:1.35}
.sources h4{font-size:16px;margin-bottom:8px}
.src-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.src{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:15px}
.src b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.claim-list{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.claim{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.claim.is-ok{border-color:var(--good)}
.claim-t{font-weight:600;margin-bottom:10px}
.claim-n{display:block;font-size:12px;color:var(--muted);font-weight:400}
.claim .btn-row{margin-top:10px}
.hint-list{margin:10px 0 0;padding:10px 14px 10px 30px;background:var(--accent-soft);border-radius:8px;font-size:15px}
.fb{margin-top:10px;font-size:15px;font-weight:600}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.first-call{margin-top:6px}
.claim-sum{margin-top:14px}

/* bias */
.bias{display:grid;gap:16px}
.bias-ctrl{display:grid;gap:8px;max-width:520px}
.check,.radio{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;cursor:pointer;padding:4px 0}
.check input,.radio input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.bias-out{display:grid;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rate{display:grid;grid-template-columns:60px 1fr 70px;align-items:center;gap:10px}
.rate-bar{height:14px;background:var(--bg);border-radius:999px;overflow:hidden}
.rate-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rate-bar.s i{background:var(--bad)}
.bias-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bias-col h5{font-size:15px;margin-bottom:6px}
.bias-col ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.bias-col li{display:grid;grid-template-columns:20px 1fr auto;gap:6px;padding:5px 8px;border-radius:6px;font-size:14.5px;color:var(--muted)}
.bias-col li.in{background:var(--surface);color:var(--ink);font-weight:600;border:1px solid var(--line)}

/* prompt lab */
.pl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.ing{border:0;padding:0;margin:0;display:grid;gap:6px}
.ing legend{font-weight:700;margin-bottom:6px}
.ing .check{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ing small{color:var(--muted);font-size:14px}
.pl-prompt{padding:12px;background:var(--ink);color:var(--bg);border-radius:8px;font-size:14px;line-height:1.5;margin-bottom:12px;min-height:70px}
.pl-out{margin-top:14px;display:grid;gap:12px}
.pl-result{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:8px;font-size:15px}
.pl-result .tag{justify-self:start}
.pl-table{border-collapse:collapse;width:100%;font-size:14px}
.pl-table th,.pl-table td{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.pl-flag{background:var(--signal);color:var(--signal-ink);padding:8px 10px;border-radius:6px;font-size:14px}
.score ul{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:4px;font-size:15px}
.score .ok{color:var(--good);font-weight:600}.score .no{color:var(--muted)}

/* rule builder */
.rb{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.rb-form{display:grid;gap:12px}
.rb-f{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;background:var(--surface)}
.rb-f legend{font-weight:700;padding:0 4px;display:flex;align-items:center;gap:8px}
.rb-f .input{margin-top:4px}
.rb-l{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--bg);font:800 16px var(--display);flex:none}
.rb-card-wrap{position:sticky;top:80px}
.rb-card{padding:20px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--signal)}
.rb-title{font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:10px}
.rb-card ol{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rb-card li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}

/* responsive */
@media (max-width:960px){
  .hero{grid-template-columns:1fr;gap:28px}
  .lesson-grid{grid-template-columns:repeat(2,1fr)}
  .clf,.pl,.rb{grid-template-columns:1fr}
  .rb-card-wrap{position:static}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .loop-steps{grid-template-columns:1fr 1fr}
  .loop-steps li:nth-child(3){border-left:0}
  .loop-steps li:nth-child(n+3){border-top:1.5px solid var(--ink)}
  .lesson-grid,.t-grid,.src-grid,.bias-grid{grid-template-columns:1fr}
  .sort-row{grid-template-columns:1fr}
  .crow a{grid-template-columns:40px 1fr}
  .crow-meta{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .resume{grid-template-columns:1fr}.resume .btn{grid-column:1;grid-row:auto;margin-top:10px;justify-self:start}
  .top{position:static}.top-in{gap:6px 10px}.nav{margin-left:auto}.nav a{padding:8px 10px}
  .save-chip{margin-left:0;width:100%;order:3;font-size:12px}
  .task{flex-direction:column;gap:4px}
  .cal-row{grid-template-columns:70px 1fr}.cal-bars{grid-column:1/-1}
  .chip{grid-template-columns:minmax(70px,110px) 1fr 42px}
  .prose p{font-size:17.5px}
}
@media (max-width:420px){.loop-steps{grid-template-columns:1fr}.loop-steps li{border-left:0!important}.loop-steps li + li{border-top:1.5px solid var(--ink)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.btn:hover,.lcard:hover,.opt:hover{transform:none!important}}
</style>
